# Operator template only. Copy it to "$HOME/.config/leubai/cloudflared.yml" and
# replace every angle-bracket value with a concrete absolute path before use.
tunnel: <tunnel-id>
credentials-file: <credentials-file-in-$HOME/.config/leubai>
protocol: http2
edge-ip-version: "4"
metrics: <metrics-address>

ingress:
  - hostname: leubai.udify.fun
    service: <local-origin>
  - service: http_status:404
