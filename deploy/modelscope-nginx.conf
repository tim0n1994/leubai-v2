pid /tmp/leubai-nginx/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    access_log off;
    server_tokens off;
    client_body_temp_path /tmp/leubai-nginx/client;
    proxy_temp_path /tmp/leubai-nginx/proxy;
    fastcgi_temp_path /tmp/leubai-nginx/fastcgi;
    uwsgi_temp_path /tmp/leubai-nginx/uwsgi;
    scgi_temp_path /tmp/leubai-nginx/scgi;
    server {
        listen 7860;
        client_max_body_size 256k;
        location / {
            proxy_pass http://127.0.0.1:5200;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Connection "";
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header CF-Connecting-IP "";
            proxy_buffering off;
            proxy_read_timeout 65s;
        }
    }
}
