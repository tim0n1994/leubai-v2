name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  TZ: Asia/Shanghai

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install
        run: bun install --frozen-lockfile

      - name: Privacy guard
        run: bun run check:privacy

      - name: Unit tests
        run: bun run test:unit

      - name: Lint
        run: bun run lint

      - name: Build
        run: bun run build

      - name: Package source release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          mkdir -p release-assets
          git archive --format=tar.gz --prefix="leubai-${RELEASE_TAG}/" "${GITHUB_SHA}" \
            -o "release-assets/leubai-${RELEASE_TAG}.tar.gz"

      - name: Publish GitHub preview release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "${RELEASE_TAG}" release-assets/*.tar.gz \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${RELEASE_TAG}" \
            --generate-notes \
            --prerelease
